name: 🚀 Deploy plugin assets/readme to WordPress.org

# Manual only: the release workflow already updates readme and assets, a push on master
# would change the readme of the stable tag before the new version is on WordPress.org.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy updates
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: WordPress.org plugin assets/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          IGNORE_OTHER_FILES: true
